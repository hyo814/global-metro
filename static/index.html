<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어디로 가는 차 — 전 세계 출발 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2f1ed;
    --board: #ffffff;
    --ink:   #10243f;
    --muted: #737e8c;
    --rule:  #dedcd5;
    --sans: 'IBM Plex Sans KR', 'Hiragino Sans', 'PingFang SC',
            'Noto Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: 384px minmax(0, 1fr);
  }
  .num { font-variant-numeric: tabular-nums; }

  /* ── 왼쪽: 검색 ─────────────────────────────── */
  .rail {
    background: var(--board); border-right: 1px solid var(--rule);
    display: flex; flex-direction: column; min-height: 0;
  }
  .brand { padding: 22px 24px 16px; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .brand p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }

  .find { padding: 0 24px 16px; display: grid; gap: 8px; }
  .find input, .find select {
    width: 100%; font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 7px; padding: 11px 13px;
  }
  .find input { font-size: 16px; }
  .find select { font-size: 14px; color: var(--muted); }
  .find input:focus-visible, .find select:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 1px; background: var(--board);
  }

  .hits { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1;
          border-top: 1px solid var(--rule); }
  .hit { padding: 12px 24px; cursor: pointer; border-bottom: 1px solid var(--rule);
         display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
  .hit:hover, .hit:focus-visible { background: var(--paper); outline: none; }
  .hit[aria-current='true'] { background: var(--paper);
                              box-shadow: inset 3px 0 0 var(--ink); }
  .cc { font-size: 11px; font-weight: 600; color: var(--muted);
        border: 1px solid var(--rule); border-radius: 4px; height: 19px;
        display: grid; place-items: center; margin-top: 2px; }
  .hit b { font-weight: 500; font-size: 15px; display: block; }
  .hit em { font-style: normal; color: var(--muted); font-size: 13px; display: block; }
  .hit i  { font-style: normal; color: var(--muted); font-size: 12px; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--rule);
         border-radius: 4px; padding: 0 4px; margin-left: 5px; }

  /* ── 오른쪽: 출발 안내 ──────────────────────── */
  .board { overflow-y: auto; padding: 34px 40px 60px; }
  .stop { max-width: 780px; margin-bottom: 26px; }
  .stop h2 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
  .stop .orig { margin: 2px 0 0; font-size: 17px; color: var(--muted); }
  .stop .meta { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule);
                display: flex; justify-content: space-between; align-items: baseline;
                font-size: 13px; color: var(--muted); gap: 16px; }

  .runs { max-width: 780px; border-collapse: collapse; width: 100%; }
  .runs tr { border-bottom: 1px solid var(--rule); }
  .runs td { padding: 13px 0; vertical-align: baseline; }
  .at   { font-size: 26px; font-weight: 500; width: 88px; letter-spacing: -.02em;
          color: var(--muted); }
  tr.soon .at { color: var(--ink); font-weight: 600; }
  .line { width: 76px; padding-right: 14px !important; }
  .line span { display: inline-block; font-size: 12px; font-weight: 600;
               padding: 2px 7px; border-radius: 4px; max-width: 100%;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
               border: 1px solid var(--rule); }
  .to b { font-weight: 500; display: block; }
  .to em { font-style: normal; display: block; color: var(--muted); font-size: 13px;
           margin-top: 1px; }
  .when { text-align: right; width: 96px; white-space: nowrap; color: var(--muted);
          font-size: 14px; }
  tr.soon .when { color: var(--ink); font-weight: 500; }
  .later { border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px;
           font-size: 11px; color: var(--muted); margin-left: 6px; }

  .blank { max-width: 440px; padding-top: 56px; }
  .blank h2 { margin: 0 0 10px; font-size: 22px; font-weight: 600; }
  .blank p { margin: 0; color: var(--muted); }
  .blank ul { margin: 20px 0 0; padding: 0; list-style: none; display: flex;
              flex-wrap: wrap; gap: 7px; }
  .blank button { font: inherit; font-size: 14px; background: var(--board);
                  border: 1px solid var(--rule); border-radius: 999px;
                  padding: 6px 14px; cursor: pointer; color: var(--ink); }
  .blank button:hover { border-color: var(--muted); }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .rail { border-right: none; border-bottom: 1px solid var(--rule); max-height: 52vh; }
    .board { padding: 24px 20px 48px; }
    .stop h2 { font-size: 25px; }
    .at { font-size: 22px; width: 72px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .hit { transition: background .12s ease; }
  }
</style>

<aside class="rail">
  <div class="brand">
    <h1>어디로 가는 차</h1>
    <p>전 세계 대중교통 출발 안내</p>
  </div>
  <div class="find">
    <input id="q" placeholder="정류장 이름 (한국어로도 됩니다)"
           autocomplete="off" autofocus aria-label="정류장 검색">
    <select id="country" aria-label="국가">
      <option value="">모든 나라</option>
    </select>
  </div>
  <ul class="hits" id="hits"></ul>
</aside>

<main class="board" id="board"></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s || '').replace(/[<>&"]/g, c =>
  ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const regionOf = (() => {
  let f; try { f = new Intl.DisplayNames(['ko'], { type: 'region' }); } catch { }
  return c => { try { return f ? f.of(c) : c; } catch { return c; } };
})();

let hits = [], picked = null;

/* ── URL이 상태다. 새로고침해도, 링크를 보내도 그대로 열린다 ── */
function readUrl() {
  const p = new URLSearchParams(location.search);
  return { q: p.get('q') || '', country: p.get('country') || '',
           feed: p.get('feed') || '', stop: p.get('stop') || '' };
}
function writeUrl(patch, push) {
  const p = new URLSearchParams(location.search);
  for (const [k, v] of Object.entries(patch)) v ? p.set(k, v) : p.delete(k);
  const url = p.toString() ? '?' + p : location.pathname;
  push ? history.pushState({}, '', url) : history.replaceState({}, '', url);
}

async function loadCountries() {
  const list = await (await fetch('/api/countries')).json();
  $('#country').insertAdjacentHTML('beforeend', list.map(c =>
    `<option value="${esc(c.code)}">${esc(regionOf(c.code))} (${c.feeds})</option>`
  ).join(''));
  $('#country').value = readUrl().country;
}

let timer;
$('#q').oninput = () => { clearTimeout(timer); timer = setTimeout(run, 230); };
$('#country').onchange = run;

async function run() {
  const q = $('#q').value.trim(), country = $('#country').value;
  writeUrl({ q, country });
  if (!q) { hits = []; $('#hits').innerHTML = ''; return blank(); }

  $('#hits').innerHTML = `<li class="hit"><i>찾는 중…</i></li>`;
  hits = await (await fetch(
    `/api/stops?q=${encodeURIComponent(q)}&country=${encodeURIComponent(country)}`)).json();

  if (!hits.length) {
    $('#hits').innerHTML = `<li class="hit"><i>그 이름으로는 찾지 못했습니다.
      철자를 바꾸거나 국가를 넓혀 보세요.</i></li>`;
    return;
  }
  paintHits();
  bindHits();
  fillIn(hits.filter(r => !r.stop_name_ko).map(r => r.stop_name), got => {
    let any = false;
    hits.forEach(r => { if (got[r.stop_name]) { r.stop_name_ko = got[r.stop_name]; any = true; } });
    if (any && $('#q').value.trim() === q) { paintHits(); bindHits(); }
  });
}

function paintHits() {
  $('#hits').innerHTML = hits.map((r, i) => `
    <li class="hit" data-i="${i}" tabindex="0" role="button"
        aria-current="${picked === r}">
      <span class="cc">${esc(r.country || '·')}</span>
      <span>
        <b>${esc(r.stop_name_ko || r.stop_name)}${
          r.is_station ? '<span class="tag">역</span>' : ''}</b>
        ${r.stop_name_ko ? `<em>${esc(r.stop_name)}</em>` : ''}
        <i>${esc(r.agency)}</i>
      </span>
    </li>`).join('');
}

function bindHits() {
  $('#hits').querySelectorAll('.hit[data-i]').forEach(li => {
    const go = () => pick(hits[li.dataset.i], true);
    li.onclick = go;
    li.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
}

/* 번역은 5초쯤 걸린다. 화면을 막지 않고 뒤에서 채운다. */
async function fillIn(texts, apply) {
  const want = [...new Set(texts.filter(Boolean))];
  if (!want.length) return;
  try {
    const r = await fetch('/api/translate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texts: want }),
    });
    if (r.ok) apply(await r.json());
  } catch { /* 번역이 안 돼도 원어로 쓸 수 있다 */ }
}

function blank() {
  picked = null;
  writeUrl({ feed: '', stop: '' });
  $('#board').innerHTML = `
    <div class="blank">
      <h2>한국어로 찾으세요</h2>
      <p>현지 표기를 몰라도 됩니다. 입력한 이름을 그 나라에서 쓰는 표기로 바꿔
         찾고, 결과는 한국어와 현지 표기를 나란히 보여줍니다.</p>
      <ul>${['브리토마트', '신주쿠', 'Fairfax'].map(s =>
        `<li><button type="button" data-s="${esc(s)}">${esc(s)}</button></li>`).join('')}</ul>
    </div>`;
  $('#board').querySelectorAll('button[data-s]').forEach(b =>
    b.onclick = () => { $('#q').value = b.dataset.s; run(); });
}

async function pick(r, push) {
  picked = r;
  writeUrl({ feed: r.feed_id, stop: r.stop_id }, push);
  $('#hits').querySelectorAll('.hit').forEach(li =>
    li.setAttribute('aria-current', hits[li.dataset.i] === r ? 'true' : 'false'));

  const head = `<div class="stop">
      <h2>${esc(r.stop_name_ko || r.stop_name)}</h2>
      ${r.stop_name_ko ? `<p class="orig">${esc(r.stop_name)}</p>` : ''}`;
  $('#board').innerHTML = head + `<p class="meta">불러오는 중…</p></div>`;

  const d = await (await fetch(`/api/departures?feed_id=${encodeURIComponent(r.feed_id)}`
    + `&stop_id=${encodeURIComponent(r.stop_id)}`)).json();

  const meta = `<div class="meta"><span>${esc(d.agency || '')}</span>
      <span class="num">현지 시각 ${esc(d.local_time || '')}</span></div></div>`;

  if (d.error) return $('#board').innerHTML = head + meta + `<p>${esc(d.error)}</p>`;
  if (!d.departures?.length)
    return $('#board').innerHTML = head + meta +
      `<p>앞으로 7일 동안 이 정류장에서 출발하는 차가 없습니다.</p>`;

  paintRuns(head + meta, d.departures);
  fillIn(d.departures.flatMap(x => [x.headsign, x.route]), got => {
    let any = false;
    d.departures.forEach(x => {
      if (got[x.headsign]) { x.headsign_ko = got[x.headsign]; any = true; }
      if (got[x.route]) { x.route_ko = got[x.route]; any = true; }
    });
    if (any && picked === r) paintRuns(head + meta, d.departures);
  });
}

function paintRuns(head, runs) {
  $('#board').innerHTML = head + '<table class="runs"><tbody>' +
    runs.map(x => `
      <tr class="${x.in_min <= 10 && x.day_offset <= 0 ? 'soon' : ''}">
        <td class="at num">${x.time}</td>
        <td class="line">${x.route ? `<span style="${styleFor(x)}">${
          esc(x.route_ko || x.route)}</span>` : ''}</td>
        <td class="to">
          <b>${esc(x.headsign_ko || x.headsign || '행선지 미표기')}</b>
          ${x.headsign_ko ? `<em>${esc(x.headsign)}</em>` : ''}</td>
        <td class="when num">${wait(x)}</td>
      </tr>`).join('') + '</tbody></table>';
}

/* 색은 운영사가 자기 피드에 넣어둔 노선 색이다. 없으면 테두리만. */
const styleFor = x => x.color
  ? `background:${esc(x.color)};color:${esc(x.text_color)};border-color:${esc(x.color)}`
  : '';

function wait(x) {
  if (x.day_offset === -1) return '<span class="later">자정 넘김</span>';
  if (x.day_offset > 0)
    return `<span class="later">${ {1:'내일', 2:'모레'}[x.day_offset]
            || x.day_offset + '일 후' }</span>`;
  if (x.in_min <= 0) return '곧';
  if (x.in_min < 60) return x.in_min + '분 후';
  return Math.floor(x.in_min / 60) + '시간 ' + (x.in_min % 60) + '분 후';
}

addEventListener('popstate', boot);

async function boot() {
  const s = readUrl();
  $('#q').value = s.q;
  $('#country').value = s.country;
  if (!s.q) return blank();
  await run();
  const found = hits.find(h => h.feed_id === s.feed && h.stop_id === s.stop);
  if (found) pick(found, false); else blank();
}

loadCountries().then(boot);
</script>
</html>
